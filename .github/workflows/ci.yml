name: CI workflow

on:
  push:
    branches: [feature/laboratorio-testing-obligatorio]
  pull_request:
    branches: [feature/laboratorio-testing-obligatorio]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
